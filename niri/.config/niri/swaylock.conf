# Plain swaylock options only. The sway config uses swaylock-effects options
# (clock, timestr), and stock swaylock rejects them.
ignore-empty-password
indicator-caps-lock
show-failed-attempts
color=0f0f0f
image=$HOME/.config/sway/wallpapers/lock-screen-beach-clouds-rock.jpg
scaling=fill
font=monospace
indicator-radius=100
indicator-thickness=8
inside-color=0f0f0fcc
inside-clear-color=0f0f0fcc
inside-ver-color=0f0f0fcc
inside-wrong-color=0f0f0fcc
ring-color=c49ec4
ring-clear-color=9ec3c4
ring-ver-color=a39ec4
ring-wrong-color=c49ea0
key-hl-color=9ec3c4
bs-hl-color=c49ea0
line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
separator-color=00000000
text-color=f0f0f0
text-clear-color=f0f0f0
text-ver-color=f0f0f0
text-wrong-color=f0f0f0
