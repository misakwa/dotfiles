# llama-swap.yaml — one endpoint for all local models, with a model UI + metrics.
#   llama-swap --config ~/Projects/llms/etc/llama-swap.yaml --listen 127.0.0.1:8080
#   UI http://127.0.0.1:8080/ui    metrics /metrics    running /running
#
# Routes by the request "model" field; serves OpenAI /v1/*, Anthropic /v1/messages,
# and /v1/embeddings on one port. Sampling = each model card's recommended params,
# kept on the llama-server cmd line so they're visible in the UI.
# Prereq: run migrate-models.sh once so ~/models has the chat GGUFs (embedder's there).

healthCheckTimeout: 300        # big models take a while to mmap on first load

includeAliasesInList: true

macros:
  models_dir: "${env.HOME}/models"                                   # no hardcoded /Users path
  srv: "/opt/homebrew/bin/llama-server --host 127.0.0.1 --port ${PORT}"

  # Flags shared by the new Qwen entries. -np 1 is required by MTP, and on the others it
  # keeps the whole context window in one slot instead of splitting it across parallel slots.
  qw_gpu: "-ngl 99 -fa on -np 1"

  # MTP draft settings. Measured on M1 Max: 3 beat 1, 2 and 4 on both Qwen models.
  # For Qwen3.8 this only pairs with --model-draft in the entry. Retune the number here once.
  mtp: "--spec-type draft-mtp --spec-draft-n-max 3"

  qw_sampling: "--top-p 0.95 --top-k 20 --min-p 0 --presence-penalty 0 --repeat-penalty 1.0"

  # preserve_thinking keeps earlier reasoning in context, which Qwen recommends for agent loops.
  qw36_kwargs: >-
    --chat-template-kwargs '{"preserve_thinking":true}'

  # Qwen3.8 thinks at xhigh by default, which is slow on an M1 Max, so this uses medium.
  # Delete reasoning_effort here to get the card default back.
  qw38_kwargs: >-
    --chat-template-kwargs '{"reasoning_effort":"medium","preserve_thinking":true}'

  # Full command bases. Each entry adds only its model path, context size and any MTP or mmproj flags.
  qw36: "${srv} --jinja ${qw_gpu} ${qw_sampling} ${qw36_kwargs} --temp 0.6"
  qw38: "${srv} --jinja ${qw_gpu} ${qw_sampling} ${qw38_kwargs} --temp 1.0"

models:
  glm-4.7-flash:
    cmd: "${srv} --jinja -m ${models_dir}/glm-4.7-flash-UD-Q4_K_XL.gguf -c 202752 --temp 0.7 --top-p 1.0 --min-p 0.01"
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300
    aliases: ["claude-glm-4.7-flash"]
  qwen3.6-27b:
    cmd: "${srv} --jinja -m ${models_dir}/qwen3.6-27b-UD-Q4_K_XL.gguf --mmproj ${models_dir}/qwen3.6-27b.mmproj.gguf -c 262144 --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0"
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300
  gpt-oss-20b:
    cmd: "${srv} --jinja -m ${models_dir}/gpt-oss-20b.gguf -c 131072 --temp 1.0 --top-p 1.0"
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300
  qwythos-9b:
    cmd: "${srv} --jinja -m ${models_dir}/qwythos-9b-Q8_0.gguf --mmproj ${models_dir}/qwythos-9b.mmproj.gguf -c 262144 --temp 0.6 --top-p 0.95 --top-k 20 --repeat-penalty 1.05"
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300
  smollm3-3b:
    cmd: "${srv} --jinja -m ${models_dir}/smollm3-3b.gguf -c 65536 --temp 0.6 --top-p 0.95"
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300
  nomic-embed-text:
    cmd: "${srv} --embeddings --pooling mean -m ${models_dir}/nomic-embed-text.gguf -c 8192"
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 0          # never auto-unload — stays resident for AnythingLLM

  # Qwen3.6-35B-A3B with MTP embedded in the GGUF. Text only. Fastest entry: about 85 tokens
  # per second with MTP against 59 without, and 650 per second for prompts against 120 on the dense 27B.
  # Qwen recommends at least 128K context for thinking to work well. Only 10 of 40 layers
  # keep a KV cache, so 256K is cheap.
  qwen3.6-35b-a3b:
    cmd: |
      ${qw36} \
      -m ${models_dir}/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf \
      -c 262144 ${mtp}
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 1800

  # Same GGUF with the MTP flags removed and the projector added.
  # Without --spec-type, llama.cpp ignores the embedded MTP head and runs a normal model.
  qwen3.6-35b-a3b-vision:
    cmd: |
      ${qw36} \
      -m ${models_dir}/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf \
      --mmproj ${models_dir}/Qwen3.6-35b-a3b.mmproj.gguf \
      -c 262144
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 1800

  # Qwen3.8-27B with the separate MTP file from the Unsloth repo. Text only.
  # Context is 128K, the minimum Qwen recommends. A 256K cache would add about 9 GB.
  # If --model-draft is rejected, the same option is spelled --spec-draft-model.
  qwen3.8-27b:
    cmd: |
      ${qw38} \
      -m ${models_dir}/Qwen3.8-27B-UD-Q4_K_XL.gguf \
      --model-draft ${models_dir}/Qwen3.8-27B-Q4_0.mtp.gguf \
      -c 131072 ${mtp}
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 1800

  # Same model and sampling with MTP off and the projector added. Use it for image input
  # and for the speed A/B against the MTP entry. The projector does not change text speed.
  qwen3.8-27b-nomtp:
    cmd: |
      ${qw38} \
      -m ${models_dir}/Qwen3.8-27B-UD-Q4_K_XL.gguf \
      --mmproj ${models_dir}/Qwen3.8-27b.mmproj.gguf \
      -c 131072
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 1800

  # Winnow-E4B is a typed-decision model. It needs the winnow-server build from
  # github.com/EldanRing/winnow-inference for POST /v1/systemone. Chat and /v1/models also work.
  # Flags are the apple-silicon launch flags that scripts/winnow.py prints. Text only, 8K context.
  # Send "winnow":{"temperature":1.2574172017327816} with systemone requests, the Q8 calibration.
  winnow-e4b:
    cmd: |
      ${env.HOME}/Projects/winnow-inference/.build/bin/winnow-server \
      --model ${models_dir}/Winnow-E4B/gguf/Winnow-E4B-Q8_0.gguf --alias Winnow-E4B \
      --ctx-size 8192 --parallel 1 --n-gpu-layers 999 --fit off --flash-attn on \
      --cache-type-k q8_0 --cache-type-v q8_0 --no-context-shift --offline --lazy-mode off \
      --split-mode none --override-tensor '^(token_embd|per_layer_token_embd)\.weight$=MTL0' \
      --batch-size 2048 --ubatch-size 1024 --threads 8 --host 127.0.0.1 --port ${PORT} \
      --jinja --reasoning off --no-warmup --cache-ram 0 --no-mmproj --spec-type none
    proxy: "http://127.0.0.1:${PORT}"
    useModelName: "Winnow-E4B"    # the server rejects any other model name
    aliases: ["Winnow-E4B"]
    ttl: 1800

# Concurrency via the matrix DSL.  & = together, | = mutually exclusive, () = group;
# any subset of a set is valid. evict_costs: higher = evicted last (embedder pinned).
# Measured footprints @ full context (RSS, GB): glm 26.5 · qwen 33.2 · qwythos 17.2 ·
# gpt-oss 15.9 · smollm 10.3 · embedder 0.3. Sets keep any co-loaded combo under ~50 GB
# (Metal compute ceiling ~54 GB). glm & qwen stay mutually exclusive (~59 GB together).
# Every big model is mutually exclusive with the others, and with glm.
matrix:
  vars:
    glm:  glm-4.7-flash
    qwen: qwen3.6-27b
    oss:  gpt-oss-20b
    qwy:  qwythos-9b
    sm:   smollm3-3b
    emb:  nomic-embed-text
    q36m: qwen3.6-35b-a3b
    q36v: qwen3.6-35b-a3b-vision
    q38m: qwen3.8-27b
    q38n: qwen3.8-27b-nomtp
    wn:   winnow-e4b
  evict_costs:
    emb: 100
  sets:
    light: "(oss & qwy & sm) & emb"        # gpt-oss + qwythos + smollm all co-load + embedder (~44 GB)
    glm:   "glm & (oss | qwy | sm) & emb"  # GLM + any one light model + embedder (<=44 GB)
    qwen:  "qwen & (oss | sm) & emb"        # Qwen + gpt-oss or smollm + embedder (<=49 GB)
    qwen36moe: "(q36m | q36v) & (oss | qwy | sm) & emb"  # 35B-A3B, text or vision, + any one light model + embedder (~49 GB est.)
    qwen38:    "(q38m | q38n) & (oss | qwy | sm) & emb"  # 3.8-27B, MTP or vision, + any one light model + embedder (~48 GB est.)
    winnow:    "wn & (oss | qwy | sm) & emb"  # Winnow-E4B + any one light model + embedder (~25 GB est.)
